# Builds the site with scripts/build.py and publishes it to GitHub Pages
# (www.chayananda.com). Only runs in the chayananda.github.io repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'chayananda/chayananda.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 scripts/build.py
      - name: Collect the site
        run: |
          mkdir _site
          cp -R index.html about case-studies portfolio play assets favicon.ico _site/
          rm -f _site/play/repos.txt
          echo "www.chayananda.com" > _site/CNAME
          touch _site/.nojekyll
      - name: Mount Play projects (separate repos) at /play/<slug>/
        env:
          PLAY_TOKEN: ${{ secrets.PLAY_TOKEN }}
        run: bash scripts/fetch_play.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
