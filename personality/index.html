        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[1].split(',');
            const dataRows = lines.slice(2);
            return dataRows.map(row => {
                const values = row.split(',');
                const rowData = {};
                headers.forEach((header, index) => {
                    rowData[header.trim()] = values[index] ? values[index].trim() : '';
                });
                return rowData;
            });
        }

        const data = parseCSV(csvData);
        const dates = [];
        const weights = [];
        const hoverTexts = [];
        const currentYear = 2023;

        data.forEach(row => {
            let dateString = row['Date'];
            const kg = parseFloat(row['Kg']);
            dateString = dateString.replace(/ \. (Mon|Tue|Wed|Thu|Fri|Sat|Sun)/, '');
            const date = new Date(`${dateString} ${currentYear}`);
            if (!isNaN(date.getTime()) && !isNaN(kg)) {
                dates.push(date);
                weights.push(kg);
                hoverTexts.push(
                    `Date: ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}<br>` +
                    `Weight: ${kg} kg<br>` +
                    `Breakfast: ${row['Breakfast']}<br>` +
                    `Lunch: ${row['Lunch']}<br>` +
                    `Snacks: ${row['Snacks']}<br>` +
                    `Dinner: ${row['Dinner']}`
                );
            }
        });

        const layout = {
            title: { text: 'Weight Loss Journey Over Time', font: { family: 'Outfit, sans-serif', size: 24, color: '#2d3748' } },
            xaxis: { title: { text: 'Date', font: { family: 'Outfit, sans-serif', size: 18, color: '#4a5568' } }, type: 'date', tickformat: '%b %d', showgrid: true, gridcolor: '#e2e8f0' },
            yaxis: { title: { text: 'Weight (kg)', font: { family: 'Outfit, sans-serif', size: 18, color: '#4a5568' } }, zeroline: false, showgrid: true, gridcolor: '#e2e8f0' },
            hovermode: 'closest', margin: { l: 60, r: 40, b: 60, t: 80 }, plot_bgcolor: '#ffffff', paper_bgcolor: '#ffffff'
        };

        function interpolateColor(color1, color2, factor) {
            const c1 = color1.match(/\w\w/g).map(x => parseInt(x, 16));
            const c2 = color2.match(/\w\w/g).map(x => parseInt(x, 16));
            const result = c1.map((v, i) => Math.round(v + factor * (c2[i] - v)));
            return `#${result.map(x => x.toString(16).padStart(2, '0')).join('')}`;
        }

        const gradientTraces = [];
        for (let i = 0; i < dates.length - 1; i++) {
            const color = interpolateColor('#DC433E', '#50B75C', i / (dates.length - 2));
            gradientTraces.push({ x: [dates[i], dates[i + 1]], y: [weights[i], weights[i + 1]], mode: 'lines', line: { color, width: 3 }, hoverinfo: 'skip', showlegend: false });
        }

        const markerTrace = {
            x: dates, y: weights, mode: 'markers', type: 'scatter', name: 'Weight (kg)',
            marker: { color: '#ffffff', size: 8, symbol: 'circle', line: { color: '#5D5D5D', width: 1 } },
            hoverinfo: 'text', text: hoverTexts
        };

        if (dates.length > 0 && weights.length > 0) {
            Plotly.newPlot('weightLossGraph', [...gradientTraces, markerTrace], layout, {
                responsive: true,
                modeBarButtonsToRemove: ['lasso2d', 'select2d', 'pan2d', 'zoomIn2d', 'zoomOut2d', 'zoom2d', 'resetScale2d', 'toImage', 'sendDataToCloud', 'autoScale2d'],
                displaylogo: false
            });
        } else {
            document.getElementById('weightLossGraph').innerHTML = '<p class="text-center text-gray-600">No valid weight data to display the graph.</p>';
        }
    </script>
</body>
</html>
